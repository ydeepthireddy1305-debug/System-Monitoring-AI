services:
  api:
    build:
      context: .

    container_name: system-monitoring-api

    env_file:
      - .env

    environment:
      DB_HOST: host.docker.internal
      DB_PORT: "3306"

    ports:
      - "8000:8000"

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=3)"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s